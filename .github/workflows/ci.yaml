#CI for product catalog service
name: product-catalog-ci
on:
    pull_request:
        branches:
        - main
jobs:
    build:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Setup Go 1.22
          uses: actions/setup-go@v2
          with:
            go-versions: 1.22

        - name: Build the project
          run: |
            cd src/product-catalog
            go mod download  
            go build -o product-catalog-service main.go
        
        - name: Run Unit Tests
          run: |
            cd src/product-catalog
            go test ./...
      

    code-quality:
        runs-on: ubuntu-latest
        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Run-Golang-lint
          run: |
                go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest
                golangci-lint run ./src/product-catalog/...
          
    deploy:
        runs-on: ubuntu-latest

        needs: build
        steps:
        - name: checkout code
          uses: actions/checkout@v4

        - name: Install Docker 
          uses: docker/setup-buildx-action@v1

        - name: Login to DockerHub
          uses: docker/login-action@v2
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Docker Push
          uses: docker/build-push-action@v4
          with:
            context: .
            file: ./src/product-catalog/Dockerfile
            push: true
            tags: ${{ secrets.DOCKER_USERNAME }}/product-catalog-service:${{ github.run_id }} 
    updatek8s:
          needs: deploy
          runs-on: ubuntu-latest
          steps:
          - name: checkout code
            uses: actions/checkout@v4
            with:
                token: ${{ secrets.GITHUB_TOKEN }}

          - name: Update Tag in K8s deployment Manifest
            run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/product-catalog:${{github.run_id}}|" kubernetes/productcatalog/deploy.yaml
          - name: Commit and Push changes to K8s deployment manifest
            run: |
                git config --global user.name "somnath060596"
                git config --global user.email "somnath060596@gmail.com"
                git add kubernetes/productcatalog/deploy.yaml
                git commit -m "[CI]: Update image tag for product-catalog deployment"
                git push origin HEAD:main